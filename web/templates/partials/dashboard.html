<div id="dashboard-view" class="panel-page active">
  <div class="header-dashboard">
    <div>
      <h1 id="welcome-title">Overview</h1>
      <p>Airsine management dashboard metrics</p>
    </div>
  </div>

  <!-- Metrics Grid -->
  <div class="stats-grid">
    <div class="stat-card" style="border-left: 4px solid #0ea5e9">
      <div class="stat-card-left">
        <h3 style="color: #0ea5e9">Total Patients</h3>
        <p
          id="stat-patients"
          style="
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
          "
        >
          0
        </p>
      </div>
      <div
        class="stat-card-right"
        style="background: rgba(14, 165, 233, 0.1); color: #0ea5e9"
      >
        <i class="fa-solid fa-user-injured"></i>
      </div>
    </div>
    <div class="stat-card" style="border-left: 4px solid #f59e0b">
      <div class="stat-card-left">
        <h3 style="color: #f59e0b">Doctors</h3>
        <p
          id="stat-doctors"
          style="
            background: linear-gradient(135deg, #d97706, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
          "
        >
          0
        </p>
      </div>
      <div
        class="stat-card-right"
        style="background: rgba(245, 158, 11, 0.1); color: #f59e0b"
      >
        <i class="fa-solid fa-user-md"></i>
      </div>
    </div>
    <div class="stat-card" style="border-left: 4px solid #ec4899">
      <div class="stat-card-left">
        <h3 style="color: #ec4899">Distributors</h3>
        <p
          id="stat-distributors"
          style="
            background: linear-gradient(135deg, #db2777, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
          "
        >
          0
        </p>
      </div>
      <div
        class="stat-card-right"
        style="background: rgba(236, 72, 153, 0.1); color: #ec4899"
      >
        <i class="fa-solid fa-truck"></i>
      </div>
    </div>
    <div class="stat-card" style="border-left: 4px solid #10b981">
      <div class="stat-card-left">
        <h3 style="color: #10b981">Admins / Staff</h3>
        <p
          id="stat-staff"
          style="
            background: linear-gradient(135deg, #059669, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
          "
        >
          0
        </p>
      </div>
      <div
        class="stat-card-right"
        style="background: rgba(16, 185, 129, 0.1); color: #10b981"
      >
        <i class="fa-solid fa-user-shield"></i>
      </div>
    </div>
  </div>

  <div class="dashboard-body-grid">
    <!-- Chart Panel -->
    <div class="dashboard-panel">
      <h2>
        <i class="fa-solid fa-chart-pie" style="color: #8b5cf6"></i>
        <span
          style="
            background: linear-gradient(135deg, #7c3aed, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
          "
          >Role Distribution</span
        >
      </h2>
      <div
        style="
          height: 220px;
          display: flex;
          justify-content: center;
          align-items: center;
        "
      >
        <canvas id="rolesChart"></canvas>
      </div>
    </div>

    <!-- Side Stats -->
    <div
      class="dashboard-panel"
      style="display: flex; flex-direction: column; justify-content: center"
    >
      <h2 style="margin-bottom: 6px">
        <span
          style="
            background: linear-gradient(135deg, #e11d48, #fb7185);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
          "
          >Quick Health</span
        >
      </h2>
      <p style="color: var(--text-muted); font-size: 12px; margin-bottom: 16px">
        Platform status Overview
      </p>
      <div
        style="
          display: flex;
          flex-direction: column;
          gap: 10px;
          font-size: 14px;
        "
      >
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(14, 165, 233, 0.05);
            padding: 10px;
            border-radius: 10px;
            border-left: 4px solid #0ea5e9;
          "
        >
          <div style="display: flex; align-items: center; gap: 10px">
            <div
              style="
                background: rgba(14, 165, 233, 0.1);
                width: 28px;
                height: 28px;
                border-radius: 6px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #0ea5e9;
              "
            >
              <i class="fa-solid fa-cart-shopping" style="font-size: 12px"></i>
            </div>
            <span style="font-weight: 600; color: #1e293b; font-size: 13px"
              >Orders</span
            >
          </div>
          <strong id="stat-orders-total" style="font-size: 15px; color: #0ea5e9"
            >0</strong
          >
        </div>
        <div
          style="
            display: flex;
            flex-direction: column;
            background: rgba(16, 185, 129, 0.05);
            padding: 10px;
            border-radius: 10px;
            border-left: 4px solid #10b981;
          "
        >
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
            "
          >
            <div style="display: flex; align-items: center; gap: 10px">
              <div
                style="
                  background: rgba(16, 185, 129, 0.1);
                  width: 28px;
                  height: 28px;
                  border-radius: 6px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  color: #10b981;
                "
              >
                <i class="fa-solid fa-box-open" style="font-size: 12px"></i>
              </div>
              <span style="font-weight: 600; color: #1e293b; font-size: 13px"
                >Products</span
              >
            </div>
            <strong id="stat-products" style="font-size: 15px; color: #10b981"
              >0</strong
            >
          </div>
          <div
            style="
              display: flex;
              justify-content: space-between;
              margin-top: 8px;
              font-size: 11px;
              color: #64748b;
              padding-left: 38px;
            "
          >
            <span
              >Patient/Dr:
              <strong id="stat-pat-products" style="color: #1e293b"
                >0</strong
              ></span
            >
            <span
              >Dist:
              <strong id="stat-dist-products" style="color: #1e293b"
                >0</strong
              ></span
            >
          </div>
        </div>
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(245, 158, 11, 0.05);
            padding: 10px;
            border-radius: 10px;
            border-left: 4px solid #f59e0b;
          "
        >
          <div style="display: flex; align-items: center; gap: 10px">
            <div
              style="
                background: rgba(245, 158, 11, 0.1);
                width: 28px;
                height: 28px;
                border-radius: 6px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #f59e0b;
              "
            >
              <i
                class="fa-solid fa-indian-rupee-sign"
                style="font-size: 12px"
              ></i>
            </div>
            <span style="font-weight: 600; color: #1e293b; font-size: 13px"
              >Revenue</span
            >
          </div>
          <strong id="stat-revenue" style="font-size: 15px; color: #f59e0b"
            >₹0</strong
          >
        </div>
      </div>
    </div>
  </div>
</div>
