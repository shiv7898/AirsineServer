<!-- Image Viewer Modal -->
<div
  id="image-viewer-modal"
  style="
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2100;
    backdrop-filter: blur(12px);
    background: rgba(15, 23, 42, 0.85);
    opacity: 1;
    align-items: center;
    justify-content: center;
    padding: 20px;
  "
>
  <div
    class="modal-content"
    style="
      padding: 16px;
      background: transparent;
      box-shadow: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 95%;
      height: 100%;
    "
  >
    <button
      onclick="closeModal('image-viewer-modal')"
      class="modal-close-btn"
      style="
        position: absolute;
        top: 24px;
        right: 24px;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        z-index: 50;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      "
      onmouseover="this.style.background='rgba(239, 68, 68, 0.8)'; this.style.color='#fff'; this.style.transform='rotate(90deg) scale(1.1)';"
      onmouseout="this.style.background='rgba(255, 255, 255, 0.1)'; this.style.color='#fff'; this.style.transform='none';"
    >
      <i class="fa-solid fa-times"></i>
    </button>
    
    <div style="position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 85vh;">
      
      <!-- Prev Button -->
      <button 
        id="prev-img-btn" 
        onclick="prevImage()" 
        style="
          position: absolute; 
          left: 20px; 
          background: rgba(255, 255, 255, 0.15); 
          color: white; 
          border: 1px solid rgba(255, 255, 255, 0.2); 
          border-radius: 50%; 
          width: 50px; 
          height: 50px; 
          cursor: pointer; 
          display: none; 
          justify-content: center; 
          align-items: center;
          backdrop-filter: blur(8px);
          transition: all 0.3s ease;
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
          z-index: 20;
        "
        onmouseover="this.style.background='rgba(255, 255, 255, 0.3)'; this.style.transform='scale(1.1)';"
        onmouseout="this.style.background='rgba(255, 255, 255, 0.15)'; this.style.transform='scale(1)';"
      >
        <i class="fa-solid fa-chevron-left" style="font-size: 18px;"></i>
      </button>

      <!-- Image -->
      <div style="
        position: relative;
        padding: 8px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(10px);
        max-width: 90%;
        max-height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      ">
        <img 
          id="query-image-display" 
          src="" 
          style="
            max-width: 100%; 
            max-height: 80vh; 
            object-fit: contain; 
            border-radius: 12px;
            display: block;
          " 
          alt="Query Attachment" 
        />
      </div>

      <!-- Next Button -->
      <button 
        id="next-img-btn" 
        onclick="nextImage()" 
        style="
          position: absolute; 
          right: 20px; 
          background: rgba(255, 255, 255, 0.15); 
          color: white; 
          border: 1px solid rgba(255, 255, 255, 0.2); 
          border-radius: 50%; 
          width: 50px; 
          height: 50px; 
          cursor: pointer; 
          display: none; 
          justify-content: center; 
          align-items: center;
          backdrop-filter: blur(8px);
          transition: all 0.3s ease;
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
          z-index: 20;
        "
        onmouseover="this.style.background='rgba(255, 255, 255, 0.3)'; this.style.transform='scale(1.1)';"
        onmouseout="this.style.background='rgba(255, 255, 255, 0.15)'; this.style.transform='scale(1)';"
      >
        <i class="fa-solid fa-chevron-right" style="font-size: 18px;"></i>
      </button>
    </div>
    
    <!-- Counter -->
    <div 
      id="image-counter" 
      style="
        margin-top: 20px; 
        font-weight: 500; 
        color: rgba(255, 255, 255, 0.8); 
        display: none;
        background: rgba(0, 0, 0, 0.5);
        padding: 6px 16px;
        border-radius: 20px;
        font-size: 14px;
        letter-spacing: 1px;
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      "
    ></div>
  </div>
</div>
