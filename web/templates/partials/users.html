<div id="users-view" class="panel-page">
            <div class="header-dashboard">
                <div>
                    <h3>User Directory</h3>
                    <p>Manage patients, doctors</p>
                </div>
            </div>

            <div class="dashboard-panel" style="padding: 0; overflow: hidden; flex: 1; display: flex; flex-direction: column; min-height: 0; margin-top: 16px;">
                <div class="filter-header" style="padding: 10px 32px; border-bottom: 1px solid var(--border-glass); margin-bottom: 0; background: rgba(255, 255, 255, 0.4); display: flex; justify-content: space-between; align-items: center;">
                    <h2 style="margin:0;"><i class="fa-solid fa-users"></i> Registered Users</h2>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <select id="role-filter" class="filter-select" onchange="fetchUsers()" style="padding: 6px 12px; border-radius: 12px; border: 1px solid var(--border-glass); outline: none;">
                            <option value="">All Roles</option>
                            <option value="super_admin">Super Admin</option>
                            <option value="admin">Admin</option>
                            <option value="sub_admin">Sub Admin</option>
                            <option value="doctor">Doctor</option>
                            <option value="patient">Patient</option>
                            <option value="distributor">Distributor</option>
                        </select>
                        <button id="btn-create-user" class="btn-submit" style="width: auto; padding: 6px 14px; margin: 0; font-size: 12px; background: linear-gradient(135deg, #0ea5e9, #0284c7);" onclick="switchTab('create-user-view')"><i class="fa-solid fa-user-plus"></i> New User</button>
                    </div>
                </div>
                
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>SR no</th>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Phone</th>
                                <th>Gender / Age</th>
                                <th style="text-align: center;">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="users-table-body">
                                <!-- Dynamic rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
