<div id="view-query-view" class="panel-page">
    <div
      class="header-dashboard"
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2px;
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(248, 250, 252, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(226, 232, 240, 0.6);
        padding-top: 24px;
        padding-bottom: 12px;
        margin-top: -28px;
        margin-left: -28px;
        margin-right: -28px;
        padding-left: 28px;
        padding-right: 28px;
      "
    >
      <div style="display: flex; align-items: center; gap: 16px">
        <button
          onclick="switchTab('queries-view')"
          style="
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--border-glass);
            font-size: 14px;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: var(--text-muted);
            box-shadow: var(--shadow-soft);
          "
          onmouseover="
            this.style.background = 'white';
            this.style.transform = 'translateX(-3px)';
          "
          onmouseout="
            this.style.background = 'rgba(255,255,255,0.85)';
            this.style.transform = 'none';
          "
        >
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div>
          <h1
            style="
              margin: 0;
              font-size: 24px;
              font-weight: 700;
              color: var(--text-primary);
            "
          >
            Query Details
          </h1>
          <p
            style="color: var(--text-muted); font-size: 13px; margin: 2px 0 0 0"
          >
            Review and resolve user support tickets
          </p>
        </div>
      </div>
      <div style="display: flex; gap: 12px"></div>
    </div>
    <div id="view-query-container" style="width: 100%;">
        <!-- Filled dynamically by viewQuery.js -->
    </div>
</div>
