<div id="my-profile-view" class="panel-page">
  <div class="header-dashboard">
    <div>
      <h1 style="font-size: 24px">My Profile</h1>
      <p style="color: var(--text-muted); font-size: 13px">
        Manage your personal information
      </p>
    </div>
  </div>
  <div class="profile-layout-grid">
    <!-- LEFT: Profile Card -->
    <div style="display: flex; flex-direction: column; gap: 24px">
      <div
        class="dashboard-panel"
        style="
          padding: 0;
          overflow: hidden;
          position: relative;
          border-radius: 20px;
          box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.08);
          border: 1px solid rgba(255, 255, 255, 0.8);
          background: rgba(255, 255, 255, 0.6);
          backdrop-filter: blur(20px);
        "
      >
        <div
          style="
            height: 120px;
            background: linear-gradient(
              120deg,
              var(--accent-primary),
              var(--accent-secondary)
            );
            position: relative;
          "
        ></div>
        <div
          style="
            padding: 0 24px 32px;
            text-align: center;
            margin-top: -50px;
            position: relative;
            z-index: 10;
          "
        >
          <div
            id="prof-avatar"
            style="
              width: 100px;
              height: 100px;
              border-radius: 50%;
              background: linear-gradient(135deg, #ffffff, #f8fafc);
              color: var(--accent-primary);
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 38px;
              font-weight: 800;
              margin: 0 auto 10px;
              border: 4px solid #fff;
              box-shadow: 0 12px 24px -6px rgba(14, 165, 233, 0.3);
              text-transform: uppercase;
            "
          >
            ?
          </div>
          <h2
            id="prof-name-large"
            style="
              margin: 0 auto 6px auto;
              font-size: 24px;
              font-weight: 800;
              color: var(--text-primary);
              letter-spacing: -0.5px;
              text-align: center;
              width: 100%;
            "
          >
            -
          </h2>
          <div style="margin-bottom: 20px">
            <span
              id="prof-role-badge"
              style="
                display: inline-block;
                padding: 6px 16px;
                border-radius: 20px;
                font-size: 13px;
                font-weight: 700;
                letter-spacing: 0.5px;
                text-transform: uppercase;
                background: rgba(14, 165, 233, 0.1);
                color: var(--accent-primary);
                border: 1px solid rgba(14, 165, 233, 0.2);
              "
              >-</span
            >
          </div>
          <div
            style="
              display: flex;
              flex-direction: column;
              gap: 12px;
              font-size: 14px;
              color: var(--text-muted);
              background: #fff;
              padding: 16px;
              border-radius: 16px;
              border: 1px solid rgba(226, 232, 240, 0.8);
              text-align: left;
            "
          >
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
              "
            >
              <div
                style="
                  display: flex;
                  align-items: center;
                  gap: 8px;
                  font-weight: 500;
                "
              >
                <i
                  class="fa-solid fa-id-badge"
                  style="
                    color: var(--accent-primary);
                    width: 16px;
                    text-align: center;
                  "
                ></i>
                User ID
              </div>
              <strong
                id="prof-custom-id"
                style="
                  color: var(--text-primary);
                  font-weight: 700;
                  font-family: monospace;
                  font-size: 15px;
                "
                >-</strong
              >
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- RIGHT: Detail Sections -->
    <div style="display: flex; flex-direction: column; gap: 20px">
      <div class="dashboard-panel" style="padding: 28px 32px">
        <div
          style="
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
          "
        >
          <i class="fa-solid fa-user" style="color: var(--accent-primary)"></i>
          Personal Information
        </div>
        <div class="responsive-grid-3">
          <div class="ud-field">
            <div class="ud-label">Email</div>
            <div class="ud-value" id="prof-email">-</div>
          </div>
          <div class="ud-field">
            <div class="ud-label">Mobile</div>
            <div class="ud-value" id="prof-phone">-</div>
          </div>
          <div class="ud-field">
            <div class="ud-label">Age / Gender</div>
            <div class="ud-value" id="prof-gender">-</div>
          </div>
        </div>
      </div>
      <div class="dashboard-panel" style="padding: 28px 32px">
        <div
          style="
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
          "
        >
          <i
            class="fa-solid fa-location-dot"
            style="color: var(--accent-primary)"
          ></i>
          Address
        </div>
        <div class="responsive-grid-3">
          <div class="ud-field" style="grid-column: 1 / -1">
            <div class="ud-label">Home Address</div>
            <div class="ud-value" id="prof-address-home">-</div>
          </div>
          <div class="ud-field">
            <div class="ud-label">City / Area</div>
            <div class="ud-value" id="prof-address-area">-</div>
          </div>
          <div class="ud-field">
            <div class="ud-label">State</div>
            <div class="ud-value" id="prof-address-state">-</div>
          </div>
          <div class="ud-field">
            <div class="ud-label">Pincode</div>
            <div class="ud-value" id="prof-address-pincode">-</div>
          </div>
          <div class="ud-field">
            <div class="ud-label">District</div>
            <div class="ud-value" id="prof-address-district">-</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
