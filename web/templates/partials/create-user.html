<div id="create-user-view" class="panel-page">
            <!-- Header -->
            <div style="background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 50%, #16a34a 100%); padding: 28px 32px; position: relative; overflow: hidden; flex-shrink: 0;">
                <div style="position: absolute; inset: 0; background: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2210%22 cy=%2210%22 r=%2240%22 fill=%22rgba(255,255,255,0.05)%22/><circle cx=%2290%22 cy=%2290%22 r=%2260%22 fill=%22rgba(255,255,255,0.04)%22/></svg>'); pointer-events: none;"></div>
                <div style="position: relative; display: flex; align-items: center; gap: 20px;">
                    <button onclick="switchTab('users-view')" style="display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.25); padding: 10px 18px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; color: #fff; transition: all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.25)'" onmouseout="this.style.background='rgba(255,255,255,0.15)'">
                        <i class="fa-solid fa-arrow-left"></i> Back to Users
                    </button>
                    <div>
                        <h1 style="font-size: 26px; font-weight: 800; color: #fff; letter-spacing: -0.5px; margin-bottom: 4px;">
                            <i class="fa-solid fa-user-plus" style="font-size: 22px; margin-right: 10px; opacity: 0.9;"></i>Create New User
                        </h1>
                        <p style="color: rgba(255,255,255,0.75); font-size: 13px;">Fill in the details below to register a new patient, doctor, or distributor</p>
                    </div>
                </div>
            </div>

            <!-- Form Body -->
            <div style="flex: 1; overflow-y: auto; padding: 28px 32px;">
                <form id="create-standard-user-form" onsubmit="submitCreateUser(event)">

                    <!-- Role Selector Pills -->
                    <div style="display: flex; gap: 12px; margin-bottom: 28px;">
                        <label style="flex: 1; cursor: pointer;">
                            <input type="radio" name="role-pill" value="patient" style="display:none;" onchange="document.getElementById('c-role').value='patient'; updateCreateUserForm(); updateRolePills();" checked>
                            <div class="role-pill" id="pill-patient" style="padding: 14px 20px; border-radius: 14px; border: 2px solid #06b6d4; background: rgba(6,182,212,0.08); text-align: center; transition: all 0.2s;">
                                <div style="font-size: 24px; margin-bottom: 4px;">🩺</div>
                                <div style="font-size: 13px; font-weight: 700; color: #0891b2;">Patient</div>
                            </div>
                        </label>
                        <label style="flex: 1; cursor: pointer;">
                            <input type="radio" name="role-pill" value="doctor" style="display:none;" onchange="document.getElementById('c-role').value='doctor'; updateCreateUserForm(); updateRolePills();">
                            <div class="role-pill" id="pill-doctor" style="padding: 14px 20px; border-radius: 14px; border: 2px solid #e2e8f0; background: #f8fafc; text-align: center; transition: all 0.2s;">
                                <div style="font-size: 24px; margin-bottom: 4px;">👨‍⚕️</div>
                                <div style="font-size: 13px; font-weight: 700; color: #64748b;">Doctor</div>
                            </div>
                        </label>
                        <label style="flex: 1; cursor: pointer;">
                            <input type="radio" name="role-pill" value="distributor" style="display:none;" onchange="document.getElementById('c-role').value='distributor'; updateCreateUserForm(); updateRolePills();">
                            <div class="role-pill" id="pill-distributor" style="padding: 14px 20px; border-radius: 14px; border: 2px solid #e2e8f0; background: #f8fafc; text-align: center; transition: all 0.2s;">
                                <div style="font-size: 24px; margin-bottom: 4px;">🚚</div>
                                <div style="font-size: 13px; font-weight: 700; color: #64748b;">Distributor</div>
                            </div>
                        </label>
                    </div>

                    <!-- Hidden role select (kept for JS compatibility) -->
                    <select id="c-role" required onchange="updateCreateUserForm()" style="display:none;">
                        <option value="patient">Patient</option>
                        <option value="doctor">Doctor</option>
                        <option value="distributor">Distributor</option>
                    </select>

                    <!-- Section: Basic Info -->
                    <div style="background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.03);">
                        <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: #94a3b8; margin-bottom: 18px; display: flex; align-items: center; gap: 8px;">
                            <i class="fa-solid fa-circle-info" style="color: var(--accent-primary);"></i> Basic Information
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;">
                            <div><label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px;">Full Name *</label><input type="text" id="c-name" required placeholder="Enter full name" style="width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;transition:all 0.2s;font-family:inherit;" onfocus="this.style.borderColor='#0ea5e9';this.style.boxShadow='0 0 0 3px rgba(14,165,233,0.1)'" onblur="this.style.borderColor='#e2e8f0';this.style.boxShadow='none'"></div>
                            <div><label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px;">Email *</label><input type="email" id="c-email" required placeholder="email@example.com" style="width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;transition:all 0.2s;font-family:inherit;" onfocus="this.style.borderColor='#0ea5e9';this.style.boxShadow='0 0 0 3px rgba(14,165,233,0.1)'" onblur="this.style.borderColor='#e2e8f0';this.style.boxShadow='none'"></div>
                            <div><label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px;">Password *</label><input type="password" id="c-password" required placeholder="Min 6 characters" style="width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;transition:all 0.2s;font-family:inherit;" onfocus="this.style.borderColor='#0ea5e9';this.style.boxShadow='0 0 0 3px rgba(14,165,233,0.1)'" onblur="this.style.borderColor='#e2e8f0';this.style.boxShadow='none'"></div>
                            <div><label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px;">Phone *</label><input type="text" id="c-phone" required placeholder="10-digit mobile" style="width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;transition:all 0.2s;font-family:inherit;" onfocus="this.style.borderColor='#0ea5e9';this.style.boxShadow='0 0 0 3px rgba(14,165,233,0.1)'" onblur="this.style.borderColor='#e2e8f0';this.style.boxShadow='none'"></div>
                            <div><label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px;">Gender *</label>
                                <select id="c-gender" required style="width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;background:#fff;transition:all 0.2s;font-family:inherit;" onfocus="this.style.borderColor='#0ea5e9'" onblur="this.style.borderColor='#e2e8f0'">
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div><label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px;">Age *</label><input type="number" id="c-age" required min="1" max="120" placeholder="Age" style="width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;transition:all 0.2s;font-family:inherit;" onfocus="this.style.borderColor='#0ea5e9';this.style.boxShadow='0 0 0 3px rgba(14,165,233,0.1)'" onblur="this.style.borderColor='#e2e8f0';this.style.boxShadow='none'"></div>
                            <div><label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px;">Date of Birth</label><input type="date" id="c-dob" style="width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;transition:all 0.2s;font-family:inherit;" onfocus="this.style.borderColor='#0ea5e9'" onblur="this.style.borderColor='#e2e8f0'"></div>
                        </div>
                    </div>

                    <!-- Section: Address -->
                    <div style="background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.03);">
                        <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: #94a3b8; margin-bottom: 18px; display: flex; align-items: center; gap: 8px;">
                            <i class="fa-solid fa-location-dot" style="color: #10b981;"></i> Address Details
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;">
                            <div style="grid-column: span 3;"><label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px;">Home Address</label><input type="text" id="c-address" placeholder="Building/Street address" style="width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;transition:all 0.2s;font-family:inherit;" onfocus="this.style.borderColor='#10b981';this.style.boxShadow='0 0 0 3px rgba(16,185,129,0.1)'" onblur="this.style.borderColor='#e2e8f0';this.style.boxShadow='none'"></div>
                            <div><label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px;">Area / City</label><input type="text" id="c-area" placeholder="Area or locality" style="width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;transition:all 0.2s;font-family:inherit;" onfocus="this.style.borderColor='#10b981';this.style.boxShadow='0 0 0 3px rgba(16,185,129,0.1)'" onblur="this.style.borderColor='#e2e8f0';this.style.boxShadow='none'"></div>
                            <div><label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px;">District</label><input type="text" id="c-district" placeholder="District" style="width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;transition:all 0.2s;font-family:inherit;" onfocus="this.style.borderColor='#10b981';this.style.boxShadow='0 0 0 3px rgba(16,185,129,0.1)'" onblur="this.style.borderColor='#e2e8f0';this.style.boxShadow='none'"></div>
                            <div><label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px;">State</label><input type="text" id="c-state" placeholder="State" style="width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;transition:all 0.2s;font-family:inherit;" onfocus="this.style.borderColor='#10b981';this.style.boxShadow='0 0 0 3px rgba(16,185,129,0.1)'" onblur="this.style.borderColor='#e2e8f0';this.style.boxShadow='none'"></div>
                            <div><label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px;">Pincode *</label><input type="text" id="c-pincode" required placeholder="6-digit pincode" style="width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;transition:all 0.2s;font-family:inherit;" onfocus="this.style.borderColor='#10b981';this.style.boxShadow='0 0 0 3px rgba(16,185,129,0.1)'" onblur="this.style.borderColor='#e2e8f0';this.style.boxShadow='none'"></div>
                        </div>
                    </div>

                    <!-- Section: Doctor Fields -->
                    <div id="doctor-fields" style="display:none; background: #fff; border: 1px solid #fde68a; border-radius: 18px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(245,158,11,0.07);">
                        <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: #94a3b8; margin-bottom: 18px; display: flex; align-items: center; gap: 8px;">
                            <i class="fa-solid fa-stethoscope" style="color: #f59e0b;"></i> Doctor Details
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                            <div><label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px;">Hospital / Clinic Name</label><input type="text" id="c-hospital" placeholder="Hospital name" style="width:100%;border:1.5px solid #fde68a;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;transition:all 0.2s;font-family:inherit;" onfocus="this.style.borderColor='#f59e0b';this.style.boxShadow='0 0 0 3px rgba(245,158,11,0.12)'" onblur="this.style.borderColor='#fde68a';this.style.boxShadow='none'"></div>
                            <div><label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px;">Specialisation</label><input type="text" id="c-specialisation" placeholder="e.g. Cardiologist, ENT" style="width:100%;border:1.5px solid #fde68a;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;transition:all 0.2s;font-family:inherit;" onfocus="this.style.borderColor='#f59e0b';this.style.boxShadow='0 0 0 3px rgba(245,158,11,0.12)'" onblur="this.style.borderColor='#fde68a';this.style.boxShadow='none'"></div>
                            <div><label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px;">Qualification</label><input type="text" id="c-qualification" placeholder="e.g. MBBS, MD" style="width:100%;border:1.5px solid #fde68a;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;transition:all 0.2s;font-family:inherit;" onfocus="this.style.borderColor='#f59e0b';this.style.boxShadow='0 0 0 3px rgba(245,158,11,0.12)'" onblur="this.style.borderColor='#fde68a';this.style.boxShadow='none'"></div>
                            <div><label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px;">Experience (years)</label><input type="number" id="c-experience" min="0" placeholder="Years of experience" style="width:100%;border:1.5px solid #fde68a;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;transition:all 0.2s;font-family:inherit;" onfocus="this.style.borderColor='#f59e0b';this.style.boxShadow='0 0 0 3px rgba(245,158,11,0.12)'" onblur="this.style.borderColor='#fde68a';this.style.boxShadow='none'"></div>
                        </div>
                    </div>

                    <!-- Section: Distributor Fields -->
                    <div id="distributor-fields" style="display:none; background: #fff; border: 1px solid #fbcfe8; border-radius: 18px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(236,72,153,0.07);">
                        <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: #94a3b8; margin-bottom: 18px; display: flex; align-items: center; gap: 8px;">
                            <i class="fa-solid fa-truck-fast" style="color: #ec4899;"></i> Distributor Details
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                            <div><label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px;">Company Name</label><input type="text" id="c-company" placeholder="Company / firm name" style="width:100%;border:1.5px solid #fbcfe8;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;transition:all 0.2s;font-family:inherit;" onfocus="this.style.borderColor='#ec4899';this.style.boxShadow='0 0 0 3px rgba(236,72,153,0.1)'" onblur="this.style.borderColor='#fbcfe8';this.style.boxShadow='none'"></div>
                            <div><label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px;">Business Type</label><input type="text" id="c-business-type" placeholder="e.g. Wholesale, Retail" style="width:100%;border:1.5px solid #fbcfe8;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;transition:all 0.2s;font-family:inherit;" onfocus="this.style.borderColor='#ec4899';this.style.boxShadow='0 0 0 3px rgba(236,72,153,0.1)'" onblur="this.style.borderColor='#fbcfe8';this.style.boxShadow='none'"></div>
                            <div><label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px;">License Number</label><input type="text" id="c-license" placeholder="License / registration no." style="width:100%;border:1.5px solid #fbcfe8;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;transition:all 0.2s;font-family:inherit;" onfocus="this.style.borderColor='#ec4899';this.style.boxShadow='0 0 0 3px rgba(236,72,153,0.1)'" onblur="this.style.borderColor='#fbcfe8';this.style.boxShadow='none'"></div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div style="display: flex; gap: 14px; justify-content: flex-end; padding-top: 8px; padding-bottom: 16px;">
                        <button type="button" onclick="switchTab('users-view')" style="padding: 13px 28px; border: 1.5px solid #e2e8f0; border-radius: 12px; background: #f8fafc; color: #64748b; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s;" onmouseover="this.style.background='#f1f5f9'" onmouseout="this.style.background='#f8fafc'">Cancel</button>
                        <button type="submit" class="btn-submit" style="padding: 13px 32px; margin: 0; font-size: 15px; font-weight: 700; box-shadow: 0 6px 20px rgba(14,165,233,0.3); border-radius: 12px;"><i class="fa-solid fa-user-plus" style="margin-right: 8px;"></i>Create User</button>
                    </div>

                </form>
            </div>
        </div>
