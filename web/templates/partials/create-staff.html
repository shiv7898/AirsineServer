<div id="create-staff-view" class="panel-page">
  <!-- Header -->
  <div style="background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%); padding: 14px 32px; position: relative; overflow: hidden; flex-shrink: 0; z-index: 10; border-bottom: 1px solid #e2e8f0;">
      <div style="position: absolute; inset: 0; background: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22><path d=%22M0 40L40 0H20L0 20M40 40V20L20 40%22 fill=%22none%22 stroke=%22rgba(0,0,0,0.02)%22 stroke-width=%221%22/></svg>'); pointer-events: none;"></div>
      <div style="position: relative; display: flex; align-items: center; gap: 16px;">
          <button onclick="switchTab('admin-staff-view')" style="display: flex; align-items: center; gap: 6px; background: #ffffff; border: 1px solid #cbd5e1; padding: 6px 14px; border-radius: 10px; font-size: 11px; font-weight: 600; cursor: pointer; color: #334155; box-shadow: 0 1px 2px rgba(0,0,0,0.02); transition: all 0.2s;" onmouseover="this.style.background='#f1f5f9'; this.style.color='#0f172a'" onmouseout="this.style.background='#ffffff'; this.style.color='#334155'">
              <i class="fa-solid fa-arrow-left"></i> Back to Staff
          </button>
          <div>
              <h1 style="font-size: 18px; font-weight: 800; color: #0f172a; letter-spacing: -0.5px; margin-bottom: 2px;">
                  <i class="fa-solid fa-user-shield" style="font-size: 16px; margin-right: 8px; color: #8b5cf6;"></i>Add Admin / Sub Admin
              </h1>
              <p style="color: #64748b; font-size: 11px;">Create new administrative accounts and assign granular access permissions</p>
          </div>
      </div>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 28px 32px; background: #f8fafc;">
    <form id="create-staff-form">
      <style>
        /* Modernize Form Wrappers */
        #create-staff-form .form-section {
          background: #ffffff !important;
          border: 1px solid rgba(226,232,240,0.8) !important;
          border-radius: 20px !important;
          padding: 32px !important;
          box-shadow: 0 10px 30px rgba(0,0,0,0.03) !important;
          transition: all 0.3s ease !important;
          margin-bottom: 24px !important;
        }
        #create-staff-form .form-section:hover {
          box-shadow: 0 15px 35px rgba(59,130,246,0.08) !important;
          border-color: rgba(59,130,246,0.3) !important;
          transform: translateY(-2px) !important;
        }

        /* Modernize Section Headers */
        #create-staff-form .form-section-title {
          font-size: 13px !important;
          color: #3b82f6 !important;
          margin-bottom: 24px !important;
          letter-spacing: 1.5px !important;
          font-weight: 700 !important;
          text-transform: uppercase !important;
          border-bottom: none !important;
          display: flex;
          align-items: center;
        }
        #create-staff-form .form-section-title i {
          background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(139,92,246,0.15)) !important;
          padding: 8px !important;
          border-radius: 8px !important;
          color: #3b82f6 !important;
          margin-right: 12px !important;
        }

        /* Modernize Inputs */
        #create-staff-form input,
        #create-staff-form select,
        #create-staff-form textarea {
          background: #f8fafc !important;
          border: 2px solid #e2e8f0 !important;
          border-radius: 12px !important;
          padding: 12px 16px !important;
          font-weight: 500 !important;
          color: #334155 !important;
          transition: all 0.2s ease !important;
          width: 100% !important;
          outline: none !important;
        }
        #create-staff-form input:focus,
        #create-staff-form select:focus,
        #create-staff-form textarea:focus {
          background: #ffffff !important;
          border-color: #3b82f6 !important;
          box-shadow: 0 0 0 4px rgba(59,130,246,0.15) !important;
          transform: translateY(-1px) !important;
        }
        
        /* Modernize Labels */
        #create-staff-form label:not(.perm-checkbox-label) {
          font-size: 13px !important;
          font-weight: 700 !important;
          color: #475569 !important;
          margin-bottom: 8px !important;
          display: block !important;
        }
        
        /* Modernize Submit Buttons */
        #create-staff-form button[type="submit"] {
          background: linear-gradient(135deg, #2563eb, #3b82f6) !important;
          border: none !important;
          border-radius: 14px !important;
          padding: 14px 24px !important;
          font-size: 15px !important;
          font-weight: 700 !important;
          letter-spacing: 0.5px !important;
          box-shadow: 0 10px 20px rgba(59,130,246,0.3) !important;
          transition: all 0.3s ease !important;
          color: white !important;
        }
        #create-staff-form button[type="submit"]:hover {
          transform: translateY(-2px) !important;
          box-shadow: 0 15px 25px rgba(59,130,246,0.4) !important;
        }

        #create-staff-form button[type="reset"] {
          border: none !important;
          border-radius: 14px !important;
          padding: 14px 24px !important;
          font-size: 15px !important;
          font-weight: 700 !important;
          background: #f1f5f9 !important;
          color: #64748b !important;
          transition: all 0.3s ease !important;
        }
        #create-staff-form button[type="reset"]:hover {
          background: #e2e8f0 !important;
          color: #334155 !important;
        }

        /* Fix input wrapper icons */
        #create-staff-form .input-wrapper {
          position: relative;
        }
        #create-staff-form .input-wrapper i {
          position: absolute;
          left: 14px !important;
          top: 50% !important;
          transform: translateY(-50%) !important;
          color: #94a3b8 !important;
          font-size: 14px !important;
          z-index: 2;
        }
        #create-staff-form .input-wrapper textarea ~ i, #create-staff-form .input-wrapper i.fa-house {
          top: 24px !important;
        }
        #create-staff-form .input-wrapper input,
        #create-staff-form .input-wrapper select,
        #create-staff-form .input-wrapper textarea {
          padding-left: 44px !important;
        }

        /* Modernize Permissions Modules */
        #create-staff-form .perm-module {
          background: #f8fafc !important;
          border: 1.5px solid #e2e8f0 !important;
          border-radius: 16px !important;
          padding: 16px !important;
          transition: all 0.2s ease !important;
        }
        #create-staff-form .perm-module:hover {
          border-color: #3b82f6 !important;
          background: #ffffff !important;
          box-shadow: 0 4px 12px rgba(59,130,246,0.1) !important;
        }
        #create-staff-form .perm-module h4 {
          font-size: 13px !important;
          font-weight: 800 !important;
          color: #1e293b !important;
          margin-bottom: 12px !important;
        }
        #create-staff-form .perm-module h4 i {
          color: #3b82f6 !important;
          margin-right: 6px !important;
        }
      </style>
      <!-- Section 1: Basic Info -->
      <div class="form-section">
        <div class="form-section-title">
          <i class="fa-solid fa-id-card"></i> Basic Information
        </div>
        <div class="staff-form-grid">
          <div class="form-group">
            <label>Full Name</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-user"></i
              ><input
                type="text"
                id="staff-name"
                placeholder="John Doe"
                required
              />
            </div>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-envelope"></i
              ><input
                type="email"
                id="staff-email"
                placeholder="john@airsine.com"
                required
              />
            </div>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock"></i
              ><input
                type="password"
                id="staff-password"
                placeholder="Min 6 chars, 1 letter + 1 number"
                required
              />
            </div>
          </div>
          <div class="form-group">
            <label>Assign Role</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-user-tag" style="z-index: 2"></i>
              <select id="staff-role" required>
                <option value="admin">Admin</option>
                <option value="sub_admin" selected>Sub Admin</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-phone"></i
              ><input
                type="tel"
                id="staff-phone"
                placeholder="9876543210"
                required
              />
            </div>
          </div>
          <div class="form-group">
            <label>Gender</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-venus-mars" style="z-index: 2"></i>
              <select id="staff-gender" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Age</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-cake-candles"></i
              ><input
                type="number"
                id="staff-age"
                placeholder="30"
                required
                min="18"
                max="100"
              />
            </div>
          </div>
          <div class="form-group">
            <label>Date of Birth</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-calendar"></i
              ><input type="date" id="staff-dob" required onclick="this.max=new Date().toISOString().split('T')[0]" onchange="calculateAgeFromDOB(this.value, 'staff-age')" />
            </div>
          </div>
        </div>
      </div>

      <!-- Section 2: Location -->
      <div class="form-section">
        <div class="form-section-title">
          <i class="fa-solid fa-location-dot"></i> Address & Location
        </div>
        <div class="staff-form-grid">
          <div class="form-group col-span-2">
            <label>Home Address</label>
            <div class="input-wrapper">
              <i
                class="fa-solid fa-house"
                style="top: 18px; transform: none"
              ></i
              ><textarea
                id="staff-address"
                rows="2"
                placeholder="Street address, building, etc."
                required
                style="padding-left: 44px; resize: none; padding-top: 12px"
              ></textarea>
            </div>
          </div>
          <div class="form-group">
            <label>Area / Locality</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-map-location-dot"></i
              ><input
                type="text"
                id="staff-area"
                placeholder="Locality / Area"
                required
              />
            </div>
          </div>
          <div class="form-group">
            <label>District</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-city"></i
              ><input
                type="text"
                id="staff-district"
                placeholder="District"
                required
              />
            </div>
          </div>
          <div class="form-group">
            <label>State</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-map"></i
              ><input
                type="text"
                id="staff-state"
                placeholder="State"
                required
              />
            </div>
          </div>
          <div class="form-group">
            <label>Pincode</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-map-pin"></i
              ><input
                type="text"
                id="staff-pincode"
                placeholder="6-digit pincode"
                required
                pattern="\d{6}"
              />
            </div>
          </div>
        </div>
      </div>

      <!-- Section 3: Permissions -->
      <div class="form-section">
        <div class="form-section-title">
          <i class="fa-solid fa-shield-halved"></i> Access Permissions
        </div>
        <div
          style="
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
          "
        >
          <div class="perm-module">
            <h4><i class="fa-solid fa-gauge-high"></i> Dashboard</h4>
            <div class="perm-checkbox-row">
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-dash-view" checked /><span
                  >View</span
                ></label
              >
            </div>
          </div>
          <div class="perm-module">
            <h4><i class="fa-solid fa-users"></i> User Directory</h4>
            <div class="perm-checkbox-row">
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-user-view" checked /><span
                  >View</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-user-create" /><span
                  >Create</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-user-edit" /><span
                  >Edit</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-user-delete" /><span
                  >Delete</span
                ></label
              >
            </div>
          </div>
          <div class="perm-module">
            <h4><i class="fa-solid fa-user-shield"></i> Admin Roles</h4>
            <div class="perm-checkbox-row">
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-staff-view" /><span
                  >View</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-staff-create" /><span
                  >Create</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-staff-edit" /><span
                  >Edit</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-staff-delete" /><span
                  >Delete</span
                ></label
              >
            </div>
          </div>
          <div class="perm-module">
            <h4><i class="fa-solid fa-building"></i> Distributors</h4>
            <div class="perm-checkbox-row">
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-distributor-view" checked /><span
                  >View</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-distributor-create" /><span
                  >Create</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-distributor-edit" /><span
                  >Edit</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-distributor-delete" /><span
                  >Delete</span
                ></label
              >
            </div>
          </div>
          <div class="perm-module">
            <h4><i class="fa-solid fa-box"></i> Products</h4>
            <div class="perm-checkbox-row">
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-product-view" checked /><span
                  >View</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-product-create" /><span
                  >Create</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-product-edit" /><span
                  >Edit</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-product-delete" /><span
                  >Delete</span
                ></label
              >
            </div>
          </div>
          <div class="perm-module">
            <h4><i class="fa-solid fa-cart-shopping"></i> Orders</h4>
            <div class="perm-checkbox-row">
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-order-view" checked /><span
                  >View</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-order-edit" /><span
                  >Update</span
                ></label
              >
            </div>
          </div>
          <div class="perm-module">
            <h4><i class="fa-solid fa-headset"></i> Queries</h4>
            <div class="perm-checkbox-row">
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-query-view" checked /><span
                  >View</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-query-edit" /><span
                  >Respond</span
                ></label
              >
            </div>
          </div>
        </div>
      </div>

      <div style="display: flex; gap: 12px; margin-top: 4px">
        <button type="submit" class="btn-submit" style="max-width: 220px">
          <i class="fa-solid fa-check"></i> Create Account
        </button>
        <button
          type="reset"
          class="btn-submit"
          style="
            max-width: 140px;
            background: rgba(100, 116, 139, 0.15);
            color: var(--text-muted);
            box-shadow: none;
          "
        >
          Reset
        </button>
      </div>
    </form>
  </div>
</div>
