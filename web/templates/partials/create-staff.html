<div id="create-staff-view" class="panel-page">
  <div class="header-dashboard">
    <div>
      <h1>
        <i
          class="fa-solid fa-user-plus"
          style="color: var(--accent-primary); font-size: 24px"
        ></i>
        Add Admin / Sub Admin
      </h1>
      <p>
        Create new administrative accounts and assign granular access
        permissions
      </p>
    </div>
  </div>

  <div class="dashboard-panel" style="max-width: 100%; padding: 28px 32px">
    <form id="create-staff-form">
      <!-- Section 1: Basic Info -->
      <div class="form-section">
        <div class="form-section-title">
          <i class="fa-solid fa-id-card"></i> Basic Information
        </div>
        <div class="staff-form-grid">
          <div class="form-group">
            <label>Full Name</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-user"></i
              ><input
                type="text"
                id="staff-name"
                placeholder="John Doe"
                required
              />
            </div>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-envelope"></i
              ><input
                type="email"
                id="staff-email"
                placeholder="john@airsine.com"
                required
              />
            </div>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock"></i
              ><input
                type="password"
                id="staff-password"
                placeholder="Min 6 chars, 1 letter + 1 number"
                required
              />
            </div>
          </div>
          <div class="form-group">
            <label>Assign Role</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-user-tag" style="z-index: 2"></i>
              <select id="staff-role" required>
                <option value="admin">Admin</option>
                <option value="sub_admin" selected>Sub Admin</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-phone"></i
              ><input
                type="tel"
                id="staff-phone"
                placeholder="9876543210"
                required
              />
            </div>
          </div>
          <div class="form-group">
            <label>Gender</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-venus-mars" style="z-index: 2"></i>
              <select id="staff-gender" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Age</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-cake-candles"></i
              ><input
                type="number"
                id="staff-age"
                placeholder="30"
                required
                min="18"
                max="100"
              />
            </div>
          </div>
          <div class="form-group">
            <label>Date of Birth</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-calendar"></i
              ><input type="date" id="staff-dob" required />
            </div>
          </div>
        </div>
      </div>

      <!-- Section 2: Location -->
      <div class="form-section">
        <div class="form-section-title">
          <i class="fa-solid fa-location-dot"></i> Address & Location
        </div>
        <div class="staff-form-grid">
          <div class="form-group col-span-2">
            <label>Home Address</label>
            <div class="input-wrapper">
              <i
                class="fa-solid fa-house"
                style="top: 18px; transform: none"
              ></i
              ><textarea
                id="staff-address"
                rows="2"
                placeholder="Street address, building, etc."
                required
                style="padding-left: 44px; resize: none; padding-top: 12px"
              ></textarea>
            </div>
          </div>
          <div class="form-group">
            <label>Area / Locality</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-map-location-dot"></i
              ><input
                type="text"
                id="staff-area"
                placeholder="Locality / Area"
                required
              />
            </div>
          </div>
          <div class="form-group">
            <label>District</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-city"></i
              ><input
                type="text"
                id="staff-district"
                placeholder="District"
                required
              />
            </div>
          </div>
          <div class="form-group">
            <label>State</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-map"></i
              ><input
                type="text"
                id="staff-state"
                placeholder="State"
                required
              />
            </div>
          </div>
          <div class="form-group">
            <label>Pincode</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-map-pin"></i
              ><input
                type="text"
                id="staff-pincode"
                placeholder="6-digit pincode"
                required
                pattern="\d{6}"
              />
            </div>
          </div>
        </div>
      </div>

      <!-- Section 3: Permissions -->
      <div class="form-section">
        <div class="form-section-title">
          <i class="fa-solid fa-shield-halved"></i> Access Permissions
        </div>
        <div
          style="
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
          "
        >
          <div class="perm-module">
            <h4><i class="fa-solid fa-gauge-high"></i> Dashboard</h4>
            <div class="perm-checkbox-row">
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-dash-view" checked /><span
                  >View</span
                ></label
              >
            </div>
          </div>
          <div class="perm-module">
            <h4><i class="fa-solid fa-users"></i> User Directory</h4>
            <div class="perm-checkbox-row">
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-user-view" checked /><span
                  >View</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-user-create" /><span
                  >Create</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-user-edit" /><span
                  >Edit</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-user-delete" /><span
                  >Delete</span
                ></label
              >
            </div>
          </div>
          <div class="perm-module">
            <h4><i class="fa-solid fa-user-shield"></i> Admin Roles</h4>
            <div class="perm-checkbox-row">
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-staff-view" /><span
                  >View</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-staff-create" /><span
                  >Create</span
                ></label
              >
            </div>
          </div>
          <div class="perm-module">
            <h4><i class="fa-solid fa-building"></i> Distributors</h4>
            <div class="perm-checkbox-row">
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-distributor-view" checked /><span
                  >View</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-distributor-create" /><span
                  >Create</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-distributor-edit" /><span
                  >Edit</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-distributor-delete" /><span
                  >Delete</span
                ></label
              >
            </div>
          </div>
          <div class="perm-module">
            <h4><i class="fa-solid fa-box"></i> Products</h4>
            <div class="perm-checkbox-row">
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-product-view" checked /><span
                  >View</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-product-create" /><span
                  >Create</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-product-edit" /><span
                  >Edit</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-product-delete" /><span
                  >Delete</span
                ></label
              >
            </div>
          </div>
          <div class="perm-module">
            <h4><i class="fa-solid fa-cart-shopping"></i> Orders</h4>
            <div class="perm-checkbox-row">
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-order-view" checked /><span
                  >View</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-order-edit" /><span
                  >Update</span
                ></label
              >
            </div>
          </div>
          <div class="perm-module">
            <h4><i class="fa-solid fa-headset"></i> Queries</h4>
            <div class="perm-checkbox-row">
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-query-view" checked /><span
                  >View</span
                ></label
              >
              <label class="perm-checkbox-label"
                ><input type="checkbox" id="perm-query-edit" /><span
                  >Respond</span
                ></label
              >
            </div>
          </div>
        </div>
      </div>

      <div style="display: flex; gap: 12px; margin-top: 4px">
        <button type="submit" class="btn-submit" style="max-width: 220px">
          <i class="fa-solid fa-check"></i> Create Account
        </button>
        <button
          type="reset"
          class="btn-submit"
          style="
            max-width: 140px;
            background: rgba(100, 116, 139, 0.15);
            color: var(--text-muted);
            box-shadow: none;
          "
        >
          Reset
        </button>
      </div>
    </form>
  </div>
</div>
