<div id="admin-staff-view" class="panel-page">
    <div class="header-dashboard">
        <div>
            <h3>Admin Staff Directory</h3>
            <p>Manage administrators and sub-administrators</p>
        </div>
    </div>

    <div class="dashboard-panel" style="padding: 0; overflow: hidden; flex: 1; display: flex; flex-direction: column; min-height: 0; margin-top: 16px;">
        <div class="filter-header" style="padding: 10px 32px; border-bottom: 1px solid var(--border-glass); margin-bottom: 0; background: rgba(255, 255, 255, 0.4); display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin:0;"><i class="fa-solid fa-user-shield"></i> Administrative Staff</h2>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button class="btn-submit" style="width: auto; padding: 6px 14px; margin: 0; font-size: 12px; background: linear-gradient(135deg, #6366f1, #4f46e5);" onclick="switchTab('create-staff-view')"><i class="fa-solid fa-user-plus"></i> Add Admin Staff</button>
            </div>
        </div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>SR no</th>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Phone</th>
                        <th style="text-align: center;">Actions</th>
                    </tr>
                </thead>
                <tbody id="admin-staff-table-body">
                    <!-- Dynamic rows -->
                </tbody>
            </table>
        </div>
    </div>
</div>
