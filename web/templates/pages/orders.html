<div id="orders-view" class="panel-page">
    <div class="dashboard-panel" style="padding: 0; overflow: hidden; flex: 1; display: flex; flex-direction: column; min-height: 0; margin-top: 16px;">
        <div class="filter-header" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border-glass); margin-bottom: 0; background: rgba(255, 255, 255, 0.4);">
            <div>
                <h3 style="margin: 0; display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 800;">
                    <div style="background: linear-gradient(135deg, #f59e0b, #d97706); width: 40px; height: 40px; border-radius: 12px; display: flex; justify-content: center; align-items: center; color: white; box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);">
                        <i class="fa-solid fa-cart-shopping" style="font-size: 18px;"></i>
                    </div>
                    <span style="background: linear-gradient(to right, #1e293b, #d97706); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Order History</span>
                </h3>
                <p style="margin: 0px 0 0 52px; color: #64748b; font-size: 13px; font-weight: 500; letter-spacing: 0.02em;">Track and manage customer and distributor orders</p>
            </div>
            <div style="display: flex; align-items: center; gap: 16px; width: 100%; max-width: 450px; justify-content: flex-end;">
                <div class="search-box" style="position: relative; max-width: 300px; width: 100%;">
                    <i class="fa-solid fa-search" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="text" id="search-orders-input" placeholder="Search by ID, name, or phone..." onkeyup="filterOrdersData()" style="width: 100%; padding: 8px 12px 8px 36px; border: 1px solid var(--border-glass); border-radius: 8px; font-size: 14px; outline: none;">
                </div>
            </div>
        </div>
        
        <div class="table-container">
            <style>
                #orders-view table {
                    width: 100%;
                    border-collapse: separate;
                    border-spacing: 0;
                }
                #orders-view thead th {
                    background: #f8fafc;
                    color: #64748b;
                    text-transform: uppercase;
                    font-size: 12px;
                    font-weight: 700;
                    letter-spacing: 0.05em;
                    padding: 14px 16px;
                    border-bottom: 2px solid #e2e8f0;
                    text-align: left;
                }
                #orders-view thead th:first-child {
                    border-top-left-radius: 8px;
                }
                #orders-view thead th:last-child {
                    border-top-right-radius: 8px;
                }
            </style>
            <table>
                <thead>
                    <tr>
                        <th style="width: 40px; text-align: center;">S.No</th>
                        <th>Order ID</th>
                        <th>Customer Details</th>
                        <th>Product Details</th>
                        <th>Final Amount</th>
                        <th>Order Date</th>
                        <th>Status</th>
                        <th style="text-align: center;">Actions</th>
                    </tr>
                </thead>
                <tbody id="orders-table-body">
                    <!-- Dynamic rows -->
                    <tr><td colspan="8" style="text-align: center; color: var(--text-muted); padding: 20px;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
        <div id="orders-pagination"></div>
    </div>
</div>
