<style>
  #my-profile-view {
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    padding-bottom: 40px;
    background: transparent;
  }
  
  /* Scrollbar for profile view */
  #my-profile-view::-webkit-scrollbar {
    width: 6px;
  }
  #my-profile-view::-webkit-scrollbar-track {
    background: transparent;
  }
  #my-profile-view::-webkit-scrollbar-thumb {
    background: rgba(14, 165, 233, 0.3);
    border-radius: 10px;
  }
  #my-profile-view::-webkit-scrollbar-thumb:hover {
    background: rgba(14, 165, 233, 0.6);
  }

  .profile-header-sticky {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(248, 250, 252, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 16px 32px;
    border-bottom: 1px solid rgba(226, 232, 240, 0.6);
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 20px -10px rgba(0, 0, 0, 0.05);
  }

  .profile-layout-modern {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 24px;
    padding: 0 32px;
    align-items: start;
  }

  .modern-panel {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 24px;
    box-shadow: 0 12px 40px -12px rgba(0, 0, 0, 0.08);
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .modern-panel:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 50px -12px rgba(0, 0, 0, 0.12);
  }

  .prof-gradient-bg {
    height: 110px;
    background: linear-gradient(135deg, var(--accent-primary, #0ea5e9), var(--accent-secondary, #38bdf8));
    position: relative;
  }
  .prof-gradient-bg::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0; height: 40%;
    background: linear-gradient(to top, rgba(255,255,255,0.4), transparent);
  }

  .prof-avatar-modern {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffffff, #f1f5f9);
    color: var(--accent-primary, #0ea5e9);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 800;
    margin: -45px auto 12px;
    border: 4px solid #fff;
    box-shadow: 0 8px 24px -4px rgba(14, 165, 233, 0.35);
    text-transform: uppercase;
    position: relative;
    z-index: 10;
  }

  .ud-field-modern {
    background: rgba(255, 255, 255, 0.5);
    border: 1px solid rgba(226, 232, 240, 0.6);
    padding: 16px;
    border-radius: 16px;
    transition: all 0.2s ease;
  }
  .ud-field-modern:hover {
    background: #fff;
    border-color: var(--accent-primary, #0ea5e9);
    box-shadow: 0 4px 12px rgba(14, 165, 233, 0.08);
  }

  .ud-label-modern {
    font-size: 10px; /* 12px - 2px */
    font-weight: 700;
    color: var(--text-muted, #64748b);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .ud-value-modern {
    font-size: 12px; /* 14px - 2px */
    font-weight: 600;
    color: var(--text-primary, #1e293b);
    word-break: break-word;
  }

  .section-title-modern {
    font-size: 10px; /* 12px - 2px */
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted, #64748b);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title-modern i {
    color: var(--accent-primary, #0ea5e9);
    background: rgba(14, 165, 233, 0.1);
    padding: 6px;
    border-radius: 8px;
    font-size: 12px;
  }

  .responsive-grid-modern {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
  }

  @media (max-width: 900px) {
    .profile-layout-modern {
      grid-template-columns: 1fr;
    }
  }
</style>

<div id="my-profile-view" class="panel-page">
  <!-- Sticky Header -->
  <div class="profile-header-sticky">
    <div>
      <h1 style="font-size: 22px; font-weight: 800; margin: 0; color: var(--text-primary, #0f172a); letter-spacing: -0.5px;">My Profile</h1>
      <p style="color: var(--text-muted, #64748b); font-size: 11px; margin: 4px 0 0 0; font-weight: 500;">
        Manage your personal information
      </p>
    </div>
    <div style="background: rgba(14, 165, 233, 0.1); color: var(--accent-primary, #0ea5e9); padding: 8px 16px; border-radius: 20px; font-size: 11px; font-weight: 700; border: 1px solid rgba(14, 165, 233, 0.2);">
      <i class="fa-solid fa-shield-halved" style="margin-right: 6px;"></i>Secure Profile
    </div>
  </div>

  <div class="profile-layout-modern">
    <!-- LEFT: Profile Card -->
    <div style="display: flex; flex-direction: column; gap: 24px">
      <div class="modern-panel">
        <div class="prof-gradient-bg"></div>
        <div style="padding: 0 24px 28px; text-align: center; position: relative;">
          <div id="prof-avatar" class="prof-avatar-modern">?</div>
          <h2 id="prof-name-large" style="margin: 0 auto 4px auto; font-size: 22px; font-weight: 800; color: var(--text-primary, #1e293b); letter-spacing: -0.5px; text-align: center;">-</h2>
          <div style="margin-bottom: 20px">
            <span id="prof-role-badge" style="display: inline-block; padding: 4px 14px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; background: linear-gradient(135deg, rgba(14,165,233,0.15), rgba(14,165,233,0.05)); color: var(--accent-primary, #0ea5e9); border: 1px solid rgba(14, 165, 233, 0.2); box-shadow: 0 2px 8px rgba(14,165,233,0.1);">
              -
            </span>
          </div>
          
          <!-- ID Card -->
          <div style="background: linear-gradient(145deg, #ffffff, #f8fafc); padding: 16px; border-radius: 16px; border: 1px solid rgba(226, 232, 240, 0.8); text-align: left; display: flex; align-items: center; justify-content: space-between; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);">
            <div style="display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 12px; color: var(--text-muted, #64748b);">
              <i class="fa-solid fa-id-badge" style="color: var(--accent-primary, #0ea5e9); font-size: 14px;"></i>
              User ID
            </div>
            <strong id="prof-custom-id" style="color: var(--text-primary, #1e293b); font-weight: 800; font-family: 'Courier New', monospace; font-size: 13px; background: rgba(14, 165, 233, 0.1); padding: 4px 10px; border-radius: 8px;">
              -
            </strong>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: Detail Sections -->
    <div style="display: flex; flex-direction: column; gap: 24px">
      <!-- Personal Info Panel -->
      <div class="modern-panel" style="padding: 28px 32px">
        <div class="section-title-modern">
          <i class="fa-solid fa-user"></i>
          Personal Information
        </div>
        <div class="responsive-grid-modern">
          <div class="ud-field-modern">
            <div class="ud-label-modern">Email</div>
            <div class="ud-value-modern" id="prof-email">-</div>
          </div>
          <div class="ud-field-modern">
            <div class="ud-label-modern">Mobile</div>
            <div class="ud-value-modern" id="prof-phone">-</div>
          </div>
          <div class="ud-field-modern">
            <div class="ud-label-modern">Age / Gender</div>
            <div class="ud-value-modern" id="prof-gender">-</div>
          </div>
        </div>
      </div>

      <!-- Address Panel -->
      <div class="modern-panel" style="padding: 28px 32px">
        <div class="section-title-modern">
          <i class="fa-solid fa-location-dot"></i>
          Address Details
        </div>
        <div class="responsive-grid-modern">
          <div class="ud-field-modern" style="grid-column: 1 / -1">
            <div class="ud-label-modern">Home Address</div>
            <div class="ud-value-modern" id="prof-address-home">-</div>
          </div>
          <div class="ud-field-modern">
            <div class="ud-label-modern">City / Area</div>
            <div class="ud-value-modern" id="prof-address-area">-</div>
          </div>
          <div class="ud-field-modern">
            <div class="ud-label-modern">State</div>
            <div class="ud-value-modern" id="prof-address-state">-</div>
          </div>
          <div class="ud-field-modern">
            <div class="ud-label-modern">Pincode</div>
            <div class="ud-value-modern" id="prof-address-pincode">-</div>
          </div>
          <div class="ud-field-modern">
            <div class="ud-label-modern">District</div>
            <div class="ud-value-modern" id="prof-address-district">-</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
